<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M4 · 视觉感知台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans CJK SC",sans-serif;color:#e7eef5;background:#0b1219}*{box-sizing:border-box}body{margin:0}header{padding:24px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26323d}h1{font-size:24px;margin:4px 0}small,.muted{color:#91a2b3}header small{letter-spacing:.14em}.pill{border:1px solid #3f5668;border-radius:30px;padding:8px 15px;font-size:13px}main{max-width:1600px;margin:auto;padding:24px 4vw}.notice{background:#142636;border-left:3px solid #7adfc0;padding:14px 18px;margin-bottom:22px;color:#b9d4df;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.viewer{border:1px solid #2b3c4c;background:#05090e;border-radius:12px;overflow:hidden}.bar{display:flex;justify-content:space-between;padding:14px 18px;background:#121d28;font-size:13px}#screen{display:block;width:100%;height:60vh;min-height:300px;object-fit:contain}#waiting{padding:30px;text-align:center;color:#a6b7c5}.foot{font-size:12px;color:#93a5b8}.card{background:#121d28;border:1px solid #283a4a;border-radius:12px;padding:20px;margin-bottom:14px}.card h2{font-size:12px;font-weight:500;color:#99afbf;margin:0 0 12px}.value{font-size:36px;font-weight:600}.value em{font-style:normal;font-size:14px;color:#91a2b3;margin-left:6px}.stage{padding:12px 0;border-bottom:1px solid #263846;font-size:14px;display:flex;justify-content:space-between}.stage:last-child{border:0}.good{color:#7adfc0}.warn{color:#ffc47e}.error{color:#ff8f8f}dl{font-size:13px;line-height:1.8;margin:0}dt{color:#99afbf}dd{margin:0 0 8px;overflow-wrap:anywhere}.logs{margin-top:22px}summary{cursor:pointer;color:#a7bbcb;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 monospace;max-height:300px;overflow:auto;background:#070d13;padding:18px;border:1px solid #263846;border-radius:8px}a{color:#7adfc0}.bottom{font-size:12px;color:#8296a8;margin:20px 0}[hidden]{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:14px}#screen{height:50vh}header,main{padding:18px}}
</style><header><div><small>UAV PROJECT / M4</small><h1>视觉感知台</h1></div><span id="connection" class="pill">正在连接</span></header>
<main><div id="notice" class="notice">正在读取本次运行信息…</div><div class="layout"><section><div class="viewer"><div class="bar"><span>检测画面 · 原始比例</span><span id="fresh">等待第一帧</span></div><div id="waiting">模型预热中。首次启动请稍候；异常原因可在下方运行日志查看。</div><img id="screen" hidden alt="M4 检测画面"><div class="bar foot"><span id="source">—</span><span id="resolution">—</span><a href="/frame.jpg" target="_blank">查看当前原图</a></div></div><details class="logs"><summary>运行日志与连接信息</summary><pre id="logs">等待日志</pre></details><p class="bottom">检测框对应当前推理图像；航迹 ID 单独显示。当前消息未含统一时间戳，因此不把最新航迹强行叠加到另一帧图像。</p></section><aside>
<div class="card"><h2>当前检测</h2><div class="value"><span id="targets">—</span><em>个目标</em></div><p class="muted" id="confidence">最高置信度 —</p></div><div class="card"><h2>消息链路 · 最近更新</h2><div class="stage"><span>图像输入</span><span id="camera">等待</span></div><div class="stage"><span>目标检测</span><span id="detector">等待</span></div><div class="stage"><span>视觉跟踪</span><span id="tracker">等待</span></div></div><div class="card"><h2>跟踪结果</h2><dl><dt>航迹 ID</dt><dd id="ids">—</dd><dt>画面面积占比</dt><dd id="areas">—</dd><dt>收到的状态</dt><dd id="state">尚未收到</dd></dl></div><div class="card"><h2>本次输入</h2><dl><dt>模式</dt><dd id="mode">—</dd><dt>图像话题</dt><dd id="topic">—</dd><dt>模型文件</dt><dd id="model">—</dd></dl></div></aside></div></main>
<script>
const $=id=>document.getElementById(id);let imageBusy=false;
function stage(name,d){let age=d.ages[name],el=$(name);el.className=age===undefined?'muted':age>3?'warn':'good';el.textContent=age===undefined?'等待消息':age>3?'已停更 '+age.toFixed(1)+' 秒':d.rates[name].toFixed(1)+' Hz';}
async function tick(){try{let r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();let failures=Object.entries(d.processes).filter(([_,v])=>v!==null);$('connection').textContent=failures.length?'进程异常 · 查看日志':'控制台已连接';$('connection').className='pill '+(failures.length?'error':'good');$('notice').textContent=d.mode==='demo'?'本地视频演示：用于检查检测与跟踪链路。当前画面不来自无人机仿真，测试权重的检出效果不代表无人机识别效果。':'仿真接入：使用指定图像话题，不会自动切换到替代图片。请核对模型是否适合无人机目标。';$('targets').textContent=d.targets;$('confidence').textContent='最高置信度 '+d.confidence.toFixed(2);$('ids').textContent=d.ids.length?d.ids.join(' · '):'当前无有效航迹';$('areas').textContent=d.areas.length?d.areas.map(x=>(100*x).toFixed(2)+'%').join(' / '):'—';$('state').textContent=d.state;$('mode').textContent=d.source;$('topic').textContent=d.topic;$('model').textContent=d.model;$('source').textContent=d.source;$('resolution').textContent=d.shape?d.shape.join(' × ')+' px':'等待推理图像';for(let n of ['camera','detector','tracker'])stage(n,d);let age=d.ages.image;$('fresh').textContent=age===undefined?'等待第一帧':age>3?'画面已停更 '+age.toFixed(1)+' 秒':'画面更新于 '+age.toFixed(1)+' 秒前';$('fresh').className=age>3?'warn':'good';$('logs').textContent='ROS master: '+d.master+'\n\n'+Object.entries(d.logs).map(([k,v])=>'── '+k+' ──\n'+v).join('\n\n');if(d.frames&&!imageBusy){imageBusy=true;const img=new Image();img.onload=()=>{$('screen').src=img.src;$('screen').hidden=false;$('waiting').hidden=true;imageBusy=false};img.onerror=()=>{imageBusy=false};img.src='/frame.jpg?t='+Date.now();}}catch(e){$('connection').textContent='连接已断开';$('connection').className='pill error';$('fresh').textContent='画面未更新';}}
setInterval(tick,500);tick();
</script></html>
